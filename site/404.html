<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E1C1B" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Leavory</title>
    <!-- The host serves this page at any depth, and the site may live at
         the domain root or under /leavory/ (GitHub Pages): set the base
         before any link resolves. The links are added here too, so the
         browser does not fetch them early from the wrong place. -->
    <script>
      // Written by the parser, so the stylesheet still blocks rendering
      // like a plain <link> and the page never paints unstyled.
      document.write(
        `<base href="${location.pathname.startsWith("/leavory/") ? "/leavory/" : "/"}" />` +
          '<link rel="icon" type="image/svg+xml" href="favicon.svg" />' +
          '<link rel="stylesheet" href="css/styles.css" />',
      );
    </script>
    <noscript><link rel="stylesheet" href="/css/styles.css" /></noscript>
    <style>
      .missing {
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 24px;
        min-height: 100svh;
        padding-block: 64px;
      }
      .missing h1 {
        font-size: clamp(40px, 6.4vw, 88px);
        font-weight: 540;
        line-height: 1;
        letter-spacing: -0.045em;
      }
      .missing p {
        max-width: var(--measure);
        font-size: 18px;
        color: var(--text-2);
      }
      .missing .pill {
        height: 44px;
        padding: 0 20px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="wrap missing">
      <a href="./" class="logo" aria-label="Leavory home">
        <svg
          class="logo__mark"
          viewBox="3 1.5 18 21.5"
          width="24"
          height="24"
          aria-hidden="true"
        >
          <!-- The isotype from the page's sprite. -->
          <mask
            id="mark-m"
            maskUnits="userSpaceOnUse"
            x="0"
            y="0"
            width="24"
            height="24"
          >
            <path
              d="M3 1.5H21V11.2C21 16.6 17.3 20.6 12 23 6.7 20.6 3 16.6 3 11.2Z"
              fill="#fff"
            />
            <path d="M15 -6 L-6 15" stroke="#000" stroke-width="1.6" />
            <path d="M21.5 -6 L-6 21.5" stroke="#000" stroke-width="1.6" />
            <path d="M28 -6 L-6 28" stroke="#000" stroke-width="1.6" />
          </mask>
          <rect
            width="24"
            height="24"
            fill="currentColor"
            mask="url(#mark-m)"
          />
        </svg>
        <span>Leavory</span>
      </a>
      <p class="mono">404</p>
      <h1>Page not found.</h1>
      <p>The page you asked for doesn’t exist or has moved.</p>
      <a class="pill pill--light" href="./">Back to the home page</a>
    </main>
  </body>
</html>
